    <title>Document</title>

  <body>
    <script>
      new Promise(res => {
        res();
      }).then(() => {
        console.log(0);
      });
      Promise.resolve().then(() => {
        console.log(1);
      });
      setTimeout(() => {
        console.log(2);
      }, 0);
      console.log(3);
    </script>
